<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Skyline Villas">
  <!-- Brand mark: the wordmark's initial in the site's own palette.
       #191715 and #FCFAF6 are the foreground/background tokens from index.css,
       and the serif stack mirrors the Cormorant Garamond fallback chain so the
       letterform matches the nav wordmark wherever it renders. -->
  <rect width="64" height="64" fill="#191715"/>
  <text
    x="32"
    y="33"
    fill="#FCFAF6"
    font-family="'Cormorant Garamond','Iowan Old Style',Georgia,'Times New Roman',serif"
    font-size="44"
    font-weight="400"
    text-anchor="middle"
    dominant-baseline="central"
  >S</text>
</svg>
